# Entorno de desarrollo / demostración.
#   Solo infraestructura:  docker compose up -d postgres minio
#   Todo el stack:         docker compose up -d --build
name: mecaelectric

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meca}
      POSTGRES_DB: ${POSTGRES_DB:-mecaelectric}
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-meca}']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mecaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mecaminio-dev-secret}
    ports: ['9000:9000', '9001:9001']
    volumes: [minio:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Crea el bucket privado (sin acceso anónimo: todo se sirve con URLs firmadas).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-mecaminio} $${MINIO_ROOT_PASSWORD:-mecaminio-dev-secret} &&
      mc mb --ignore-existing local/mecaelectric && mc anonymous set none local/mecaelectric"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mecaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mecaminio-dev-secret}

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-meca}:${POSTGRES_PASSWORD:-meca}@postgres:5432/${POSTGRES_DB:-mecaelectric}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-dev-access-secret-min-32-characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: http://localhost:8080
      APP_PUBLIC_URL: http://localhost:8080
      TRUST_PROXY: 1
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: mecaelectric
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-mecaminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mecaminio-dev-secret}
      S3_FORCE_PATH_STYLE: 'true'
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-change-me-dev-storage-signing-secret}
    ports: ['3000:3000']

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports: ['8080:80']

volumes:
  pgdata:
  minio:
